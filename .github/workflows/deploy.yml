name: Deploy EdgeEver

on:
  push:
    branches:
      - main
    paths-ignore:
      - "apps/site/**"
      - "apps/mobile/**"
      - ".github/workflows/deploy-site.yml"
      - ".github/workflows/mobile-build.yml"
      - ".github/workflows/sync-edgeever-upstream.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: edgeever-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Cloudflare Worker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      EDGE_EVER_WORKER_NAME: edgeever
      EDGE_EVER_WORKERS_DEV: "true"
      EDGE_EVER_CUSTOM_DOMAIN: edgeever.guoyingwei.top
      EDGE_EVER_D1_DATABASE_NAME: edgeever
      EDGE_EVER_D1_DATABASE_ID: ${{ secrets.EDGE_EVER_D1_DATABASE_ID }}
      EDGE_EVER_R2_BUCKET_NAME: edgeever-resources
      EDGE_EVER_R2_PREVIEW_BUCKET_NAME: edgeever-resources-preview
      EDGE_EVER_AUTH_USERNAME: admin
      EDGE_EVER_AUTH_PASSWORD_HASH: ${{ secrets.EDGE_EVER_AUTH_PASSWORD_HASH }}
      EDGE_EVER_SESSION_TTL_DAYS: "400"
      EDGE_EVER_DEMO_MODE: "false"
      EDGE_EVER_DEPLOYMENT_TRIGGER: ${{ github.event_name == 'push' && 'main_push' || 'manual' }}
      EDGE_EVER_DEPLOYMENT_METHOD: "github_actions"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build, migrate, deploy, and verify
        run: bun run deploy
